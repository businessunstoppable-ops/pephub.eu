{% extends "base.html" %}

{% block title %}Payment Cancelled{% endblock %}

{% block content %}
<div class="alert alert-warning">
    <h2>Payment Cancelled</h2>
    <p>Your payment was not completed. You can try again or continue shopping.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Continue Shopping</a>
    <a href="{{ url_for('view_cart') }}" class="btn btn-secondary">Return to Cart</a>
</div>
{% endblock %}
