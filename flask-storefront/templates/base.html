<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pep Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .product-card {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-radius: 1rem;
            overflow: hidden;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <style>
        body { background:#141414; color:#F5F5F5; }
        .nav-pep .navbar-brand { font-weight: 800; color: #fff !important; font-size: 1.55rem; letter-spacing:-0.5px; text-decoration: none; }
        .nav-pep .navbar-brand .brand-hub { background: #FF9000; color: #000; border-radius: 6px; padding: 0.05em 0.3em; margin-left: 2px; font-weight: 900; }
    </style>
    <nav class="navbar navbar-expand-lg sticky-top nav-pep" style="background:#000;border-bottom:1px solid #2D2D2D;">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Pep<span class="brand-hub">Hub</span></a>
            <a href="{{ url_for('cart') }}" class="btn" style="border:1px solid #FF9000;color:#FF9000;border-radius:6px;padding:0.4rem 1.2rem;font-weight:600;font-size:0.85rem;">
                🛒 Cart
                {% if session.cart %}
                <span class="badge" style="background:#FF9000;color:#000;">{{ session.cart|length }}</span>
                {% endif %}
            </a>
        </div>
    </nav>
    <div class="container mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
